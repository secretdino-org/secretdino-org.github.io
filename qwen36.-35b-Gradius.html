<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gradius Clone</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { border: 1px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 480;

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, vol = 0.15) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function sfxShoot() { playSound(800, 'square', 0.05, 0.08); }
function sfxHit() { playSound(200, 'sawtooth', 0.15, 0.12); }
function sfxExplode() { playSound(80, 'sawtooth', 0.4, 0.15); }
function sfxPowerup() { playSound(600, 'sine', 0.1, 0.1); setTimeout(() => playSound(900, 'sine', 0.15, 0.1), 100); }
function sfxBossHit() { playSound(150, 'square', 0.2, 0.1); }

// Input
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

// Game state
let gameState = 'title'; // title, playing, gameover, win
let score = 0;
let highScore = parseInt(localStorage.getItem('gradiusHigh') || '0');
let lives = 3;
let scrollX = 0;
let levelLength = 6000;
let bossDefeated = false;
let frameCount = 0;

// Stars background
const stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 + 0.5, speed: Math.random() * 2 + 0.5 });
}

// Player
const player = {
    x: 80, y: 240, w: 32, h: 16,
    speed: 3, baseSpeed: 3, maxSpeed: 6,
    bullets: [], options: [],
    powerups: { speed: 0, missile: 0, laser: 0, half: 0, shield: false },
    shootCooldown: 0, invincible: 0,
    alive: true, respawnTimer: 0,
    optionCount: 0
};

// Enemies
let enemies = [];
let enemyBullets = [];
let powerups = [];
let particles = [];
let boss = null;

// Level data - spawn points along the scroll
function getLevelData() {
    const data = [];
    // Wave 1 - small enemies
    for (let x = 400; x < levelLength - 800; x += 200) {
        data.push({ type: 'wing', x: x, y: 100 + Math.random() * 280, w: 20, h: 16, hp: 1, speed: 1.5 + Math.random(), phase: Math.random() * Math.PI * 2 });
    }
    // Wave 2 - vertical movers
    for (let x = 600; x < levelLength - 800; x += 300) {
        data.push({ type: 'vertical', x: x, y: 50 + Math.random() * 300, w: 24, h: 20, hp: 2, speed: 1.2, phase: Math.random() * Math.PI * 2, amplitude: 60 });
    }
    // Wave 3 - shooters
    for (let x = 500; x < levelLength - 800; x += 400) {
        data.push({ type: 'shooter', x: x, y: 80 + Math.random() * 320, w: 28, h: 24, hp: 3, speed: 0.8, shootTimer: 0 });
    }
    // Wave 4 - heavy enemies
    for (let x = 700; x < levelLength - 800; x += 500) {
        data.push({ type: 'heavy', x: x, y: 120 + Math.random() * 240, w: 36, h: 30, hp: 5, speed: 0.6 });
    }
    // Powerup drops
    for (let x = 300; x < levelLength - 800; x += 500) {
        data.push({ type: 'powerup', x: x, y: 150 + Math.random() * 200 });
    }
    // Boss
    data.push({ type: 'boss', x: levelLength - 300, w: 80, h: 60, hp: 60, maxHp: 60, phase: 0, shootTimer: 0, moveTimer: 0 });
    return data;
}

let levelData = getLevelData();
let spawnedEnemies = new Set();

function spawnEnemy(e) {
    if (spawnedEnemies.has(e.x)) return;
    spawnedEnemies.add(e.x);
    const enemy = { ...e, alive: true };
    if (e.type === 'boss') {
        boss = enemy;
    }
    enemies.push(enemy);
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 30 + Math.random() * 20, color, size: Math.random() * 4 + 1 });
    }
}

function resetPlayer() {
    player.x = 80;
    player.y = 240;
    player.bullets = [];
    player.options = [];
    player.powerups = { speed: 0, missile: 0, laser: 0, half: 0, shield: false };
    player.shootCooldown = 0;
    player.invincible = 120;
    player.alive = true;
    player.respawnTimer = 0;
    player.optionCount = 0;
}

function initGame() {
    score = 0;
    lives = 3;
    scrollX = 0;
    bossDefeated = false;
    frameCount = 0;
    enemies = [];
    enemyBullets = [];
    powerups = [];
    particles = [];
    boss = null;
    levelData = getLevelData();
    spawnedEnemies = new Set();
    resetPlayer();
    gameState = 'playing';
}

// Drawing helpers
function drawShip(x, y, w, h) {
    // Main body
    ctx.fillStyle = '#0af';
    ctx.fillRect(x - w/2 + 4, y - h/2 + 2, w - 8, h - 4);
    // Nose
    ctx.fillStyle = '#0df';
    ctx.beginPath();
    ctx.moveTo(x + w/2, y);
    ctx.lineTo(x + w/2 - 10, y - 6);
    ctx.lineTo(x + w/2 - 10, y + 6);
    ctx.fill();
    // Wings
    ctx.fillStyle = '#08a';
    ctx.fillRect(x - w/2, y - h/2 - 4, 12, 6);
    ctx.fillRect(x - w/2, y + h/2 - 2, 12, 6);
    // Cockpit
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 4, y - 2, 6, 4);
    // Engine glow
    ctx.fillStyle = `rgba(255, 100, 0, ${0.5 + Math.sin(frameCount * 0.3) * 0.3})`;
    ctx.fillRect(x - w/2 - 6, y - 3, 8, 6);
}

function drawBoss(b) {
    const bx = b.x - scrollX;
    // Main body
    ctx.fillStyle = '#a22';
    ctx.fillRect(bx - 40, b.y - 30, 80, 60);
    ctx.fillStyle = '#c33';
    ctx.fillRect(bx - 35, b.y - 25, 70, 50);
    // Eyes
    ctx.fillStyle = '#ff0';
    ctx.fillRect(bx - 15, b.y - 10, 12, 12);
    ctx.fillRect(bx + 3, b.y - 10, 12, 12);
    ctx.fillStyle = '#f00';
    ctx.fillRect(bx - 12, b.y - 7, 6, 6);
    ctx.fillRect(bx + 6, b.y - 7, 6, 6);
    // Cannons
    ctx.fillStyle = '#888';
    ctx.fillRect(bx - 45, b.y - 20, 10, 8);
    ctx.fillRect(bx - 45, b.y + 12, 10, 8);
    // HP bar
    ctx.fillStyle = '#333';
    ctx.fillRect(bx - 40, b.y - 45, 80, 6);
    ctx.fillStyle = '#f00';
    ctx.fillRect(bx - 40, b.y - 45, 80 * (b.hp / b.maxHp), 6);
    // Shield effect when damaged
    if (b.hp < b.maxHp / 2) {
        ctx.strokeStyle = `rgba(255, 100, 0, ${0.3 + Math.sin(frameCount * 0.2) * 0.2})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bx, b.y, 50 + Math.sin(frameCount * 0.1) * 5, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawEnemy(e) {
    const ex = e.x - scrollX;
    if (ex < -60 || ex > canvas.width + 60) return;
    switch (e.type) {
        case 'wing':
            ctx.fillStyle = '#f44';
            ctx.beginPath();
            ctx.moveTo(ex + e.w/2, e.y);
            ctx.lineTo(ex - e.w/2, e.y - e.h/2);
            ctx.lineTo(ex - e.w/2 + 6, e.y);
            ctx.lineTo(ex - e.w/2, e.y + e.h/2);
            ctx.fill();
            break;
        case 'vertical':
            ctx.fillStyle = '#f80';
            ctx.fillRect(ex - e.w/2, e.y - e.h/2, e.w, e.h);
            ctx.fillStyle = '#fa0';
            ctx.fillRect(ex - e.w/2 + 4, e.y - e.h/2 + 4, e.w - 8, e.h - 8);
            break;
        case 'shooter':
            ctx.fillStyle = '#a4f';
            ctx.beginPath();
            ctx.arc(ex, e.y, e.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#c6f';
            ctx.fillRect(ex + e.w/2 - 4, e.y - 3, 10, 6);
            break;
        case 'heavy':
            ctx.fillStyle = '#4a4';
            ctx.fillRect(ex - e.w/2, e.y - e.h/2, e.w, e.h);
            ctx.fillStyle = '#6c6';
            ctx.fillRect(ex - e.w/2 + 4, e.y - e.h/2 + 4, e.w - 8, e.h - 8);
            ctx.fillStyle = '#ff0';
            ctx.fillRect(ex - 4, e.y - 4, 8, 8);
            break;
    }
}

function drawPowerup(p) {
    const px = p.x - scrollX;
    if (px < -20 || px > canvas.width + 20) return;
    const bob = Math.sin(frameCount * 0.1 + p.x * 0.01) * 3;
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(px, p.y + bob, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    const labels = { speed: 'S', missile: 'M', laser: 'L', half: 'H' };
    ctx.fillText(labels[p.type] || '?', px, p.y + bob + 4);
}

function drawBullet(b) {
    if (b.player) {
        if (b.type === 'laser') {
            ctx.fillStyle = '#0ff';
            ctx.fillRect(b.x - scrollX - b.w/2, b.y - 2, b.w, 4);
        } else if (b.type === 'missile') {
            ctx.fillStyle = '#f80';
            ctx.beginPath();
            ctx.arc(b.x - scrollX, b.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff0';
            ctx.fillRect(b.x - scrollX + 4, b.y - 1, 6, 2);
        } else {
            ctx.fillStyle = '#0f0';
            ctx.fillRect(b.x - scrollX - 8, b.y - 1.5, 16, 3);
        }
    } else {
        ctx.fillStyle = '#f44';
        ctx.beginPath();
        ctx.arc(b.x - scrollX, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#faa';
        ctx.beginPath();
        ctx.arc(b.x - scrollX, b.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Collision
function rectCollide(a, b) {
    return a.x - a.w/2 < b.x + b.w/2 && a.x + a.w/2 > b.x - b.w/2 &&
           a.y - a.h/2 < b.y + b.h/2 && a.y + a.h/2 > b.y - b.h/2;
}

function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
    const dx = Math.abs(cx - rx);
    const dy = Math.abs(cy - ry);
    if (dx > rw/2 + r || dy > rh/2 + r) return false;
    return true;
}

// Update
function update() {
    frameCount++;
    if (gameState !== 'playing') return;

    // Scroll
    scrollX += player.speed;

    // Stars
    stars.forEach(s => {
        s.x -= s.speed * (player.speed / 2);
        if (s.x < 0) { s.x = canvas.width; s.y = Math.random() * canvas.height; }
    });

    // Player movement
    if (player.alive) {
        const moveSpeed = player.baseSpeed + player.powerups.speed;
        if (keys['ArrowUp'] || keys['KeyW']) player.y -= moveSpeed;
        if (keys['ArrowDown'] || keys['KeyS']) player.y += moveSpeed;
        if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(20, player.x - moveSpeed);
        if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(canvas.width / 2 + 100, player.x + moveSpeed);

        // Speed up
        if (keys['ShiftLeft'] || keys['ShiftRight']) {
            player.speed = player.maxSpeed;
        } else {
            player.speed = moveSpeed;
        }

        // Shooting
        if (player.shootCooldown > 0) player.shootCooldown--;
        if ((keys['Space'] || keys['KeyZ']) && player.shootCooldown <= 0) {
            sfxShoot();
            if (player.powerups.laser > 0) {
                // Laser - wide beam
                player.bullets.push({ x: player.x + 16, y: player.y, w: 30, h: 4, vx: 8, vy: 0, type: 'laser', player: true });
            } else {
                player.bullets.push({ x: player.x + 16, y: player.y - 4, w: 12, h: 3, vx: 8, vy: 0, type: 'normal', player: true });
                if (player.powerups.missile > 0) {
                    player.bullets.push({ x: player.x + 16, y: player.y + 4, w: 12, h: 3, vx: 8, vy: 0, type: 'normal', player: true });
                }
            }
            player.shootCooldown = player.powerups.laser > 0 ? 6 : 8;
        }

        // Invincibility
        if (player.invincible > 0) player.invincible--;

        // Option pods
        const targetOptions = Math.min(player.optionCount, 4);
        while (player.options.length < targetOptions) {
            player.options.push({ x: player.x - 30, y: player.y });
        }
        for (let i = player.options.length - 1; i >= 0; i--) {
            const opt = player.options[i];
            const tx = player.x - 28 * (i + 1);
            opt.x += (tx - opt.x) * 0.25;
            opt.y += (player.y - opt.y) * 0.25;
        }

        // Update bullets
        for (let i = player.bullets.length - 1; i >= 0; i--) {
            const b = player.bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            if (b.x - scrollX > canvas.width + 50 || b.x - scrollX < -50 || b.y < -20 || b.y > canvas.height + 20) {
                player.bullets.splice(i, 1);
            }
        }

        // Check enemy spawns
        levelData.forEach(e => {
            if (e.type === 'boss') {
                const spawnX = e.x - scrollX;
                if (spawnX < canvas.width + 50 && !spawnedEnemies.has('boss')) {
                    spawnEnemy(e);
                }
            } else {
                const spawnX = e.x - scrollX;
                if (spawnX < canvas.width + 50 && spawnX > -50 && !spawnedEnemies.has(e.x)) {
                    spawnEnemy(e);
                }
            }
        });

        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (!e.alive) { enemies.splice(i, 1); continue; }

            switch (e.type) {
                case 'wing':
                    e.x -= e.speed;
                    e.y += Math.sin(frameCount * 0.03 + e.phase) * 1.5;
                    break;
                case 'vertical':
                    e.x -= e.speed;
                    e.y += Math.sin(frameCount * 0.04 + e.phase) * e.amplitude * 0.02;
                    break;
                case 'shooter':
                    e.x -= e.speed;
                    e.shootTimer = (e.shootTimer || 0) + 1;
                    if (e.shootTimer > 90) {
                        e.shootTimer = 0;
                        const dx = player.x - e.x;
                        const dy = player.y - e.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        enemyBullets.push({ x: e.x, y: e.y, vx: (dx / dist) * 3, vy: (dy / dist) * 3, player: false });
                    }
                    break;
                case 'heavy':
                    e.x -= e.speed;
                    e.shootTimer = (e.shootTimer || 0) + 1;
                    if (e.shootTimer > 60 && Math.abs(e.x - player.x) < 300) {
                        e.shootTimer = 0;
                        enemyBullets.push({ x: e.x, y: e.y, vx: 4, vy: 0, player: false });
                    }
                    break;
                case 'boss':
                    e.moveTimer = (e.moveTimer || 0) + 1;
                    e.y = 240 + Math.sin(e.moveTimer * 0.02) * 120;
                    e.shootTimer = (e.shootTimer || 0) + 1;
                    if (e.shootTimer > 30) {
                        e.shootTimer = 0;
                        const pattern = Math.floor(e.moveTimer / 180) % 3;
                        if (pattern === 0) {
                            // Spread shot
                            for (let a = -2; a <= 2; a++) {
                                enemyBullets.push({ x: e.x - 40, y: e.y + a * 15, vx: -4, vy: a * 0.8, player: false });
                            }
                        } else if (pattern === 1) {
                            // Aimed shot
                            const dx = player.x - e.x;
                            const dy = player.y - e.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            enemyBullets.push({ x: e.x - 40, y: e.y, vx: -(dx / dist) * 5, vy: -(dy / dist) * 5, player: false });
                        } else {
                            // Circle burst
                            for (let a = 0; a < 8; a++) {
                                const angle = (a / 8) * Math.PI * 2 + e.moveTimer * 0.05;
                                enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3, player: false });
                            }
                        }
                    }
                    break;
            }

            // Remove off-screen enemies (except boss)
            if (e.type !== 'boss' && (e.x - scrollX < -100 || e.x - scrollX > canvas.width + 100)) {
                enemies.splice(i, 1);
            }

            // Bullet-enemy collision
            for (let j = player.bullets.length - 1; j >= 0; j--) {
                const b = player.bullets[j];
                if (circleRectCollide(b.x, b.y, b.type === 'laser' ? 4 : 3, e.x, e.y, e.w, e.h)) {
                    e.hp--;
                    sfxHit();
                    spawnParticles(b.x, b.y, '#ff0', 3);
                    player.bullets.splice(j, 1);

                    if (e.hp <= 0) {
                        e.alive = false;
                        score += e.type === 'boss' ? 5000 : e.type === 'heavy' ? 200 : 100;
                        sfxExplode();
                        spawnParticles(e.x, e.y, '#f80', 15);

                        // Drop powerup from heavy/boss
                        if (e.type === 'boss') {
                            bossDefeated = true;
                            gameState = 'win';
                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('gradiusHigh', highScore.toString());
                            }
                        } else if (Math.random() < 0.15) {
                            const types = ['speed', 'missile', 'laser', 'half'];
                            powerups.push({ type: types[Math.floor(Math.random() * types.length)], x: e.x, y: e.y, vy: 0 });
                        }
                    } else if (e.type === 'boss') {
                        sfxBossHit();
                    }
                }
            }

            // Option-enemy collision
            player.options.forEach(opt => {
                if (circleRectCollide(opt.x, opt.y, 8, e.x, e.y, e.w, e.h)) {
                    e.hp--;
                    sfxHit();
                    spawnParticles(opt.x, opt.y, '#ff0', 3);
                    if (e.hp <= 0) {
                        e.alive = false;
                        score += e.type === 'boss' ? 5000 : e.type === 'heavy' ? 200 : 100;
                        sfxExplode();
                        spawnParticles(e.x, e.y, '#f80', 15);
                    }
                }
            });

            // Enemy-player collision
            if (player.alive && player.invincible <= 0) {
                if (circleRectCollide(player.x, player.y, 6, e.x, e.y, e.w, e.h)) {
                    killPlayer();
                }
            }
        }

        // Enemy bullets
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const b = enemyBullets[i];
            b.x += b.vx;
            b.y += b.vy;
            if (b.x - scrollX < -50 || b.x - scrollX > canvas.width + 50 || b.y < -20 || b.y > canvas.height + 20) {
                enemyBullets.splice(i, 1);
                continue;
            }
            if (player.alive && player.invincible <= 0) {
                if (circleRectCollide(b.x, b.y, 4, player.x, player.y, 16, 16)) {
                    enemyBullets.splice(i, 1);
                    killPlayer();
                }
            }
        }

        // Powerups
        for (let i = powerups.length - 1; i >= 0; i--) {
            const p = powerups[i];
            if (circleRectCollide(player.x, player.y, 16, p.x, p.y, 20, 20)) {
                sfxPowerup();
                switch (p.type) {
                    case 'speed': player.powerups.speed = Math.min(3, player.powerups.speed + 1); break;
                    case 'missile': player.powerups.missile++; break;
                    case 'laser': player.powerups.laser++; break;
                    case 'half': player.powerups.half++; player.optionCount++; break;
                }
                spawnParticles(p.x, p.y, '#ff0', 8);
                powerups.splice(i, 1);
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            p.vx *= 0.96;
            p.vy *= 0.96;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Check boss defeat for win condition
        if (bossDefeated) return;

        // Scrolling past boss area without killing = game over
        if (scrollX > levelLength + 200 && !bossDefeated) {
            gameState = 'gameover';
        }
    } else {
        // Respawn
        player.respawnTimer--;
        if (player.respawnTimer <= 0) {
            if (lives > 0) {
                resetPlayer();
            } else {
                gameState = 'gameover';
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('gradiusHigh', highScore.toString());
                }
            }
        }
    }
}

function killPlayer() {
    sfxExplode();
    spawnParticles(player.x, player.y, '#0af', 25);
    lives--;
    player.alive = false;
    player.respawnTimer = 90;
    player.bullets = [];
    if (lives <= 0) {
        gameState = 'gameover';
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('gradiusHigh', highScore.toString());
        }
    }
}

// Render
function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Stars
    stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + s.speed * 0.2})`;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    });

    // Grid lines for depth effect
    ctx.strokeStyle = 'rgba(0, 100, 200, 0.05)';
    ctx.lineWidth = 1;
    for (let x = (-scrollX * 0.3) % 40; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    if (gameState === 'title') {
        // Title screen
        ctx.fillStyle = '#0af';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GRADIUS', canvas.width / 2, 160);
        ctx.fillStyle = '#0df';
        ctx.font = '16px monospace';
        ctx.fillText('A Gradius Clone', canvas.width / 2, 200);

        drawShip(canvas.width / 2, 280, 48, 24);

        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        const blink = Math.sin(frameCount * 0.05) > 0;
        if (blink) ctx.fillText('Press SPACE to Start', canvas.width / 2, 360);

        ctx.fillStyle = '#888';
        ctx.font = '12px monospace';
        ctx.fillText('Arrow Keys / WASD - Move', canvas.width / 2, 410);
        ctx.fillText('SPACE / Z - Shoot', canvas.width / 2, 430);
        ctx.fillText('SHIFT - Speed Up', canvas.width / 2, 450);

        if (highScore > 0) {
            ctx.fillStyle = '#ff0';
            ctx.font = '14px monospace';
            ctx.fillText(`High Score: ${highScore}`, canvas.width / 2, 390);
        }

        if (keys['Space']) {
            audioCtx.resume();
            initGame();
        }
        return;
    }

    // Powerups
    powerups.forEach(p => drawPowerup(p));

    // Enemies
    enemies.forEach(e => { if (e.alive) drawEnemy(e); });

    // Boss
    if (boss && boss.alive) drawBoss(boss);

    // Player bullets
    player.bullets.forEach(b => drawBullet(b));

    // Enemy bullets
    enemyBullets.forEach(b => drawBullet(b));

    // Player
    if (player.alive) {
        const blink = player.invincible > 0 && Math.floor(frameCount / 4) % 2;
        if (!blink) {
            drawShip(player.x, player.y, player.w, player.h);
            // Options
            player.options.forEach((opt, i) => {
                ctx.fillStyle = '#0af';
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    }

    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - scrollX - p.size/2, p.y - p.size/2, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 10, 25);
    ctx.textAlign = 'right';
    ctx.fillText(`HI: ${highScore}`, canvas.width - 10, 25);

    // Lives
    ctx.textAlign = 'left';
    for (let i = 0; i < lives; i++) {
        drawShip(20 + i * 24, 460, 16, 8);
    }

    // Powerup indicators
    const powerLabels = [];
    if (player.powerups.speed > 0) powerLabels.push(`SPD:${'█'.repeat(player.powerups.speed)}`);
    if (player.powerups.missile > 0) powerLabels.push(`MIS:${'█'.repeat(player.powerups.missile)}`);
    if (player.powerups.laser > 0) powerLabels.push(`LAS:${'█'.repeat(player.powerups.laser)}`);
    if (player.powerups.half > 0) powerLabels.push(`HALF:${player.powerups.half}`);
    ctx.fillStyle = '#ff0';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(powerLabels.join('  '), 10, 480 - lives * 24);

    // Game Over / Win
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f44';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 200);
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, 260);
        const blink = Math.sin(frameCount * 0.05) > 0;
        if (blink) {
            ctx.fillStyle = '#ff0';
            ctx.font = '16px monospace';
            ctx.fillText('Press SPACE to Restart', canvas.width / 2, 340);
        }
        if (keys['Space']) { initGame(); }
    }

    if (gameState === 'win') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE', canvas.width / 2, 180);
        ctx.fillStyle = '#ff0';
        ctx.font = '24px monospace';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, 240);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        const blink = Math.sin(frameCount * 0.05) > 0;
        if (blink) {
            ctx.fillText('Press SPACE to Play Again', canvas.width / 2, 320);
        }
        if (keys['Space']) { initGame(); }
    }
}

// Game loop
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
