<!DOCTYPE html>
<html>
<head>
    <title>Gradius Clone</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; margin: 0 auto; background: #111; }
        #score { position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; font-size: 20px; }
    </style>
</head>
<body>
    <div id="score">SCORE: 0</div>
    <canvas id="game" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // Game objects
        let player = { x: 400, y: 500, width: 30, height: 15, speed: 5, color: '#0f0' };
        let bullets = [];
        let enemies = [];
        let particles = [];
        let score = 0;
        let level = 1;
        let gameTime = 0;

        // Input handling
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Bullet class
        function shoot() {
            if (keys[' '] || keys['ArrowUp']) {
                bullets.push({ x: player.x + player.width, y: player.y + player.height/2 - 2, width: 8, height: 4, speed: 8, color: '#ff0' });
            }
        }

        // Enemy spawner
        function spawnEnemies() {
            gameTime++;
            if (gameTime % 60 === 0) {
                enemies.push({
                    x: Math.random() * (canvas.width - 40),
                    y: -20,
                    width: 30,
                    height: 20,
                    speed: 1 + Math.random() * level,
                    color: '#f00',
                    health: level
                });
            }
        }

        // Collision detection
        function checkCollision(a, b) {
            return a.x < b.x + b.width && a.x + a.width > b.x &&
                   a.y < b.y + b.height && a.y + a.height > b.y;
        }

        // Update game state
        function update() {
            // Player movement
            if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(0, player.x - player.speed);
            if (keys['ArrowRight'] || keys['d']) player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            if (keys['ArrowUp'] || keys['w']) player.y = Math.max(0, player.y - player.speed);
            if (keys['ArrowDown'] || keys['s']) player.y = Math.min(canvas.height - player.height, player.y + player.speed);

            // Shooting
            shoot();

            // Spawn enemies
            spawnEnemies();

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.speed;
                if (b.x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
                
                // Check bullet hits
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (checkCollision(e, bullets[j])) {
                        e.health--;
                        bullets.splice(j, 1);
                        if (e.health <= 0) {
                            score += 100;
                            enemies.splice(i, 1);
                            // Explosion particles
                            for (let p = 0; p < 10; p++) {
                                particles.push({
                                    x: e.x + e.width/2, y: e.y + e.height/2,
                                    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                                    life: 30, color: '#f80'
                                });
                            }
                        }
                    }
                }

                // Remove off-screen enemies
                if (e.y > canvas.height) {
                    enemies.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Level progression
            if (score >= level * 1000) {
                level++;
            }

            scoreElement.textContent = `SCORE: ${score} LEVEL: ${level}`;
        }

        // Draw everything
        function draw() {
            // Clear
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 100; i++) {
                const x = (i * 37 + gameTime) % canvas.width;
                const y = (i * 53) % canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }

            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#080';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width, player.y + player.height/2);
            ctx.lineTo(player.x + player.width + 10, player.y + player.height/2 - 5);
            ctx.lineTo(player.x + player.width + 10, player.y + player.height/2 + 5);
            ctx.fill();

            // Draw bullets
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Draw enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
                // Enemy details
                ctx.fillStyle = '#800';
                ctx.beginPath();
                ctx.arc(e.x + 5, e.y + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + 25, e.y + 5, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
            ctx.globalAlpha = 1.0;
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
